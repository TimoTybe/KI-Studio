<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KI Studio</title>
<style>
body{background:#101827;color:white;font-family:Arial,sans-serif;margin:0;padding:20px}
h1{color:#60a5fa}
.card{background:#1e293b;padding:20px;border-radius:14px;margin:15px 0}
button{background:#2563eb;color:white;border:0;padding:14px;border-radius:9px;width:100%;margin-top:10px;font-size:16px}
</style>
</head>
<body>
<h1>KI Studio</h1>
<p>Dein persönliches KI-Video-Studio</p>
<div class="card">
<h2>🔧 Autowerkstatt</h2>
<p>KI-Mechaniker: CarPlay nachrüsten</p>
<button onclick="start('Autowerkstatt')">Projekt öffnen</button>
</div>
<div class="card">
<h2>👩‍🍳 Kochstudio</h2>
<p>Rezeptvideos mit KI-Köchin</p>
<button onclick="start('Kochstudio')">Projekt öffnen</button>
</div>
<div class="card">
<h2>🌙 Schatten der Nacht</h2>
<p>Gruselgeschichten und Hörgeschichten</p>
<button onclick="start('Schatten der Nacht')">Projekt öffnen</button>
</div>
<p id="status">Status: Bereit</p>
<script>
function start(name){
document.getElementById('status').textContent='Geöffnet: '+name;
}
</script>
</body>
</html>
