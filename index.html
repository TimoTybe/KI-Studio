<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KI Studio</title>
<style>
body{font:17px system-ui;background:#111827;color:white;max-width:700px;margin:auto;padding:20px}
section{background:#263244;padding:20px;border-radius:15px;margin:15px 0}
input,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;font:inherit;border-radius:9px}
textarea{height:170px}
button{background:#67e8f9;border:0}
.screen{aspect-ratio:16/9;background:linear-gradient(120deg,#172554,#475569);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px;border-radius:12px}
small{color:#cbd5e1}
</style>
</head>
<body>
<h1>KI Studio</h1>
<section>
<h2>🔧 Mechaniker</h2>
<label>Videothema</label>
<input id="topic" value="Autoradio mit CarPlay nachrüsten">
<button onclick="make()">Drehbuch erstellen</button>
<textarea id="script"></textarea>
<button onclick="copyScript()">Drehbuch kopieren</button>
<h3>Video-Vorschau</h3>
<div class="screen">
<h2 id="heading">Werkstatt</h2>
<p id="caption">Hier erscheinen die Szenen.</p>
</div>
<p id="count">Szene 1 von 6</p>
<button onclick="play()">▶ Vorschau mit deutscher Stimme starten</button>
<button onclick="stop()">■ Stoppen</button>
<small>Testversion: Textszenen und iPhone-Sprachausgabe. Noch keine echten Bilder und kein MP4-Export.</small>
</section>
<section><h2>👩‍🍳 Köchin</h2>In Vorbereitung</section>
<section><h2>🌙 Schatten der Nacht</h2>In Vorbereitung</section>
<script>
let scenes=[],pos=0,active=false,run=0;
const el=id=>document.getElementById(id);
function make(){
stop();
let t=el('topic').value.trim()||'Autoreparatur';
scenes=[
['Einleitung','Heute geht es um '+t+'.'],
['Vorbereitung','Wir prüfen das Fahrzeug und legen das Werkzeug bereit.'],
['Sicherheit','Zündung ausschalten und die Sicherheitshinweise beachten.'],
['Prüfung','Wir prüfen die passenden Teile und Anschlüsse für das konkrete Fahrzeug.'],
['Arbeitsschritte','Wir gehen sorgfältig vor. Keine Kabel auf Verdacht anschließen.'],
['Abschluss','Zum Schluss testen wir die Funktion. Bei Unsicherheit hilft eine Fachwerkstatt.']
];
el('script').value=scenes.map((s,i)=>(i+1)+'. '+s[0]+'\n'+s[1]).join('\n\n');
pos=0;show();
}
function show(){
el('heading').textContent=scenes[pos][0];
el('caption').textContent=scenes[pos][1];
el('count').textContent='Szene '+(pos+1)+' von '+scenes.length;
}
function stop(){
active=false;run++;
if('speechSynthesis'in window)speechSynthesis.cancel();
}
function step(id){
if(!active||id!==run)return;
if(pos>=scenes.length){stop();return;}
show();
if(!('speechSynthesis'in window)){
stop();alert('Keine Sprachausgabe verfügbar');return;
}
let u=new SpeechSynthesisUtterance(scenes[pos][1]);
u.lang='de-DE';u.rate=.9;
u.onend=u.onerror=()=>{
if(id===run){pos++;step(id);}
};
speechSynthesis.speak(u);
}
function play(){
make();active=true;step(run);
}
async function copyScript(){
try{
await navigator.clipboard.writeText(el('script').value);
alert('Kopiert');
}catch(e){
el('script').select();
alert('Text markiert. Bitte Kopieren wählen.');
}
}
document.addEventListener('visibilitychange',()=>{
if(document.hidden)stop();
});
make();
</script>
</body>
</html>
